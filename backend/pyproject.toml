[project]
name = "pcp-finder"
version = "0.1.0"
description = "Patient-navigator tool: ranked LA primary care providers with enriched details"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# Emitted by Starlette's own TestClient on import; nothing in this repo to fix.
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The agent prompt is written as long lines of prose on purpose.
ignore = ["E501"]
