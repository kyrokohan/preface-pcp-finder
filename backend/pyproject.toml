[project]
name = "pcp-finder"
version = "0.1.0"
description = "Patient-navigator tool: ranked LA primary care providers with enriched details"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
